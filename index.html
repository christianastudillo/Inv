<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#f4f1eb"><meta name="description" content="Una pequeña invitación para tomar un café."><title>Una invitación para ti</title>
<style>
:root{color-scheme:light;--paper:#fffefa;--page:#f4f1eb;--ink:#292823;--muted:#77766f;--line:#e9e5dc;--accent:#557b55;--accent-dark:#416442;--shadow:0 22px 70px rgba(48,44,35,.12);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
*{box-sizing:border-box}html{min-height:100%;background:var(--page)}body{min-height:100vh;min-height:100dvh;margin:0;padding:24px;display:grid;place-items:center;color:var(--ink);background:radial-gradient(ellipse at 15% 10%,rgba(222,211,191,.34),transparent 36%),radial-gradient(ellipse at 90% 90%,rgba(219,227,207,.38),transparent 34%),var(--page)}
button,a{font:inherit}.phone{width:min(100%,430px);height:min(820px,calc(100dvh - 48px));min-height:520px;display:flex;flex-direction:column;overflow:hidden;background:var(--paper);border:1px solid rgba(80,73,58,.09);border-radius:25px;box-shadow:var(--shadow)}
.topbar{flex:0 0 auto;min-height:76px;display:flex;align-items:center;gap:12px;padding:13px 17px;border-bottom:1px solid var(--line);background:rgba(255,254,250,.96)}
.avatar{width:43px;height:43px;flex:0 0 43px;display:grid;place-items:center;border-radius:50%;color:#596953;background:#e9eee3;font-size:15px;font-weight:600;letter-spacing:.03em}.avatar svg{width:23px;height:23px}.identity{min-width:0;flex:1}.name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:15px;font-weight:650}.status{margin-top:3px;color:var(--muted);font-size:12px}.status.typing{color:var(--accent-dark)}
.replay{width:40px;height:40px;display:grid;place-items:center;border:0;border-radius:50%;color:#62645d;background:transparent;cursor:pointer;transition:background .18s ease,transform .18s ease}.replay:hover{background:#f1efe9}.replay:active{transform:scale(.94)}.replay:focus-visible,.accept:focus-visible,.again:focus-visible{outline:3px solid #99b28e;outline-offset:3px}.replay svg{width:19px;height:19px}
.chat{position:relative;flex:1 1 auto;min-height:0;overflow:auto;overscroll-behavior:contain;padding:20px 16px;display:flex;flex-direction:column;gap:12px;background-color:#f7f5ef;background-image:radial-gradient(rgba(104,103,88,.075) .7px,transparent .7px);background-size:19px 19px;scroll-behavior:smooth}
.day{align-self:center;margin:0 0 4px;padding:6px 11px;border-radius:99px;background:rgba(255,254,250,.88);color:#77766f;font-size:11px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.message{align-self:flex-start;max-width:86%;padding:10px 12px 8px;border:1px solid rgba(45,42,35,.045);border-radius:4px 15px 15px 15px;background:#fffefa;box-shadow:0 2px 5px rgba(48,44,35,.045);opacity:0;transform:translateY(8px);animation:arrive .28s ease-out forwards;overflow-wrap:anywhere}.message.last{background:#fffdf8}.message p{display:inline;margin:0;font-size:14px;line-height:1.48}.meta{float:right;display:inline-flex;align-items:center;gap:4px;margin:7px 0 0 12px;position:relative;top:2px;white-space:nowrap;color:#77766f;font-size:10px}.checks{color:#557b55;font-size:12px;letter-spacing:-4px;padding-right:3px}
.typing{display:none;align-self:flex-start;align-items:center;gap:4px;height:35px;padding:0 13px;border:1px solid rgba(45,42,35,.045);border-radius:4px 15px 15px 15px;background:#fffefa;box-shadow:0 2px 5px rgba(48,44,35,.045)}.typing.visible{display:flex}.typing i{width:5px;height:5px;border-radius:50%;background:#8c8a80;animation:pulse 1s infinite ease-in-out}.typing i:nth-child(2){animation-delay:.14s}.typing i:nth-child(3){animation-delay:.28s}
.footer{flex:0 0 auto;display:none;padding:16px 18px calc(16px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--paper);text-align:center}.footer.visible{display:block;animation:arrive .3s ease-out both}.footer p{margin:0 0 12px;color:#5f5e57;font-size:13px;line-height:1.45}
.accept{width:100%;min-height:48px;display:inline-flex;align-items:center;justify-content:center;padding:12px 18px;border:0;border-radius:13px;color:#fff;background:var(--accent);font-weight:600;text-decoration:none;cursor:pointer;transition:background .18s ease,transform .18s ease}.accept:hover{background:var(--accent-dark)}.accept:active{transform:scale(.985)}.accept[aria-disabled=true]{background:#92958c}
.again{display:inline-block;margin:11px 0 0;padding:4px 8px;border:0;color:#6d6c65;background:transparent;font-size:12px;text-decoration:underline;text-underline-offset:3px;cursor:pointer}.hint{display:none;margin:9px 0 0!important;color:#8b5d45!important;font-size:11px!important}.hint.visible{display:block}
@keyframes arrive{to{opacity:1;transform:translateY(0)}}@keyframes pulse{0%,60%,100%{opacity:.35;transform:translateY(0)}30%{opacity:1;transform:translateY(-2px)}}
@media(max-width:560px){body{display:block;padding:0;background:var(--paper)}.phone{width:100%;height:100vh;height:100dvh;min-height:0;border:0;border-radius:0;box-shadow:none}.topbar{padding-top:max(12px,env(safe-area-inset-top))}.chat{padding-left:14px;padding-right:14px}}
@media(max-height:600px) and (min-width:561px){body{padding:12px}.phone{height:calc(100dvh - 24px);min-height:0}.chat{padding-top:13px;padding-bottom:13px;gap:9px}.footer{padding-top:10px;padding-bottom:10px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style></head><body>
<main class="phone" aria-label="Invitación para tomar un café">
<header class="topbar"><div class="avatar" aria-hidden="true"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 12a4.25 4.25 0 1 0 0-8.5 4.25 4.25 0 0 0 0 8.5Zm0 2c-4.2 0-7.5 2.2-7.5 5v1.5h15V19c0-2.8-3.3-5-7.5-5Z"/></svg></div><div class="identity"><div class="name" id="contactName">Christian</div><div class="status" id="status" aria-live="polite">en línea</div></div><button class="replay" id="replay" type="button" aria-label="Volver a empezar la conversación" title="Volver a empezar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 2.64-6.36L3 8"/><path d="M3 3v5h5"/></svg></button></header>
<section class="chat" id="chat" aria-label="Conversación"><div class="day">hoy</div><div class="typing" id="typing" aria-label="Escribiendo"><i></i><i></i><i></i></div></section>
<footer class="footer" id="footer"><p>¿Te gustaria?</p><a class="accept" id="accept" href="#" target="_blank" rel="noopener noreferrer" aria-disabled="false">Si es un sí, dale Click aquí </a><p class="hint" id="hint" role="status"></p></footer></main>
<script>
// PERSONALIZA ESTOS DATOS ANTES DE COMPARTIR LA PÁGINA.
const CONFIG={
 nombre:"Christian",
 // Número internacional, solo dígitos y código de país. Ejemplo: "593991234567".
 whatsapp:"593988477319",
 lugar:"Un Cafecito",
 mensajeWhatsApp:"¡Sí, acepto! ",
 mensajes:[
  {texto:"Holaa Mary",pausa:350,escribiendo:850},
  {texto:"Estaba pensando en que...",pausa:450,escribiendo:1150},
  {texto:"Y si vamos a tomar un cafecito? :)",pausa:0,escribiendo:1450}
 ]
};
const chat=document.getElementById("chat"),typing=document.getElementById("typing"),footer=document.getElementById("footer"),status=document.getElementById("status"),accept=document.getElementById("accept"),hint=document.getElementById("hint");
let timers=[],runId=0;
function schedule(fn,ms,id){const timer=setTimeout(()=>{if(id===runId)fn()},ms);timers.push(timer)}
function formattedTime(offset){return new Intl.DateTimeFormat("es",{hour:"2-digit",minute:"2-digit",hour12:false}).format(new Date(Date.now()+offset*60000))}
function addMessage(text,last,index){
 const row=document.createElement("article");row.className="message"+(last?" last":"");
 const message=document.createElement("p");message.textContent=text;
 const meta=document.createElement("span");meta.className="meta";
 const time=document.createElement("time");time.dateTime=new Date(Date.now()+index*60000).toISOString();time.textContent=formattedTime(index);
 const checks=document.createElement("span");checks.className="checks";checks.setAttribute("aria-label","leído");checks.textContent="✓✓";
 meta.append(time,checks);row.append(message,meta);chat.insertBefore(row,typing);chat.scrollTop=chat.scrollHeight;
}
function setTyping(active){typing.classList.toggle("visible",active);status.textContent=active?"escribiendo…":"en línea";status.classList.toggle("typing",active);if(active)chat.scrollTop=chat.scrollHeight}
function play(){
 timers.forEach(clearTimeout);timers=[];const id=++runId;
 chat.querySelectorAll(".message").forEach(node=>node.remove());footer.classList.remove("visible");hint.classList.remove("visible");setTyping(false);
 const reduced=matchMedia("(prefers-reduced-motion: reduce)").matches;let elapsed=reduced?80:500;
 CONFIG.mensajes.forEach((item,index)=>{
  const last=index===CONFIG.mensajes.length-1,typingDuration=reduced?0:item.escribiendo,pause=reduced?40:item.pausa;
  schedule(()=>setTyping(true),elapsed,id);elapsed+=typingDuration;
  schedule(()=>{setTyping(false);addMessage(item.texto.replaceAll("{LUGAR}",CONFIG.lugar),last,index)},elapsed,id);elapsed+=pause;
 });
 schedule(()=>{footer.classList.add("visible");chat.scrollTop=chat.scrollHeight},elapsed+(reduced?0:350),id);
}
function setup(){
 document.getElementById("contactName").textContent=CONFIG.nombre;
 const digits=CONFIG.whatsapp.replace(/\D/g,"");
 if(digits.length>=8&&digits.length<=15){const url=new URL("https://wa.me/"+digits);url.searchParams.set("text",CONFIG.mensajeWhatsApp);accept.href=url.toString();accept.removeAttribute("aria-disabled")}
 else{accept.href="#";accept.setAttribute("aria-disabled","true");accept.addEventListener("click",event=>{event.preventDefault();hint.textContent="Configura el número de WhatsApp en CONFIG.whatsapp para activar el enlace.";hint.classList.add("visible")})}
 document.getElementById("replay").addEventListener("click",play);play();
}
setup();
</script></body></html>
